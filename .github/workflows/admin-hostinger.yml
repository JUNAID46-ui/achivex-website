# Uploads the admin (Laravel) to Hostinger with its PHP packages installed.
# Runs when admin code is pushed to main, or by hand from the Actions tab.
#
# Repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (same as the website) and
#   FTP_ADMIN_DIR  folder of the admin subdomain, for example domains/achivex.com/public_html/admin/
# The .env file is never uploaded. Create it once on the server in that folder (see docs/HOSTINGER-MOVE.md).
name: Admin to Hostinger

on:
  push:
    branches: [main]
    paths: ['admin/**', '.github/workflows/admin-hostinger.yml']
  workflow_dispatch:

concurrency:
  group: admin-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, mbstring, intl, gd, zip
          tools: composer:v2

      - run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      # Every request goes to public/, so the code and .env cannot be opened from the browser.
      - run: cp .htaccess.hostinger .htaccess

      # Laravel writes to these folders; FTP does not create empty folders, so each gets a placeholder.
      - run: |
          for d in storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache; do
            mkdir -p "$d" && touch "$d/.keep"
          done

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: admin/
          server-dir: ${{ secrets.FTP_ADMIN_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.*
            node_modules/**
            tests/**
            api/**
            .phpunit.result.cache
            start.bat
