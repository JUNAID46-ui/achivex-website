# Builds the website and uploads it to Hostinger.
# Runs when website code is pushed to main, when the admin asks for a rebuild after a content change
# (repository_dispatch "site-rebuild"), or by hand from the Actions tab.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER     Hostinger FTP host, for example ftp.achivex.com
#   FTP_USERNAME   FTP user from hPanel > Files > FTP Accounts
#   FTP_PASSWORD   its password
#   FTP_SITE_DIR   folder of the website on that account, for example domains/achivex.com/public_html/
name: Website to Hostinger

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website-hostinger.yml']
  repository_dispatch:
    types: [site-rebuild]
  workflow_dispatch:

# One upload at a time. A newer run waits for the current one and replaces any run still waiting.
concurrency:
  group: website-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://www.achivex.com
          ADMIN_URL: https://admin.achivex.com

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: website/out/
          server-dir: ${{ secrets.FTP_SITE_DIR }}
          # Only changed files are sent. Files the admin wrote on the server are left alone.
          exclude: |
            **/.git*
            **/.git*/**
